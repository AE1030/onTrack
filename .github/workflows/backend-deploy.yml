name: Backend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}

      - name: Build and Test
        run: mvn clean verify -e
        env:
          SPRING_PROFILES_ACTIVE: test

  # Forks production on Neon and boots the new build against the copy, so a migration that would
  # break real data fails here, before anything is deployed.
  migration-check:
    uses: ./.github/workflows/migration-check.yml
    secrets: inherit

  deploy:
    needs: [test, migration-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-east5-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t us-east5-docker.pkg.dev/gen-lang-client-0316039122/ontrack-repo/ontrack-backend ./backend
          docker push us-east5-docker.pkg.dev/gen-lang-client-0316039122/ontrack-repo/ontrack-backend

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ontrack-backend \
            --image=us-east5-docker.pkg.dev/gen-lang-client-0316039122/ontrack-repo/ontrack-backend \
            --region=us-east5 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080
