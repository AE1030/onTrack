name: Syllabus Pipeline Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'tools/syllabus-pipeline/**'
      - '.github/workflows/syllabus-pipeline-deploy.yml'
  # The image is what syllabus-pipeline-run.yml executes, so it needs a way to be rebuilt
  # without an unrelated commit to main.
  workflow_dispatch:

env:
  REGION: us-east5
  PROJECT: gen-lang-client-0316039122
  IMAGE: us-east5-docker.pkg.dev/gen-lang-client-0316039122/ontrack-repo/syllabus-pipeline
  JOB: syllabus-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/syllabus-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e ".[dev]"

      # The verify and normalise rules are pure functions over dictionaries, so they are
      # tested here with no database, no Gemini and no network. That is the whole reason the
      # checks moved out of the Spring integration test: they can now actually run in CI.
      - name: Test
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/syllabus-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # `jobs deploy` creates the job on first run and updates it after, so this workflow is
      # the only thing that defines the job and there is no console state to drift from.
      #
      # Timeout is 3 hours because gemini-2.5-pro takes about 30s a document, so
      # MAX_EXTRACTIONS_PER_RUN=250 needs roughly 2 hours. At 1 hour the task was killed
      # part way through and Cloud Run started a second attempt.
      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy "$JOB" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --project="$PROJECT" \
            --task-timeout=10800s \
            --max-retries=1 \
            --memory=1Gi \
            --cpu=1 \
            --set-secrets=DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest \
            --set-env-vars=^@^SYLLABUS_TERM_STATUSES=current,future@MAX_EXTRACTIONS_PER_RUN=250@SYLLABUS_REQUEST_DELAY_SEC=0.6@FAIL_ON_VIOLATIONS=true
