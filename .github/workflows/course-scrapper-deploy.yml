name: Course Scrapper Deploy

# Builds the image and defines the Cloud Run Job. It never runs the job:
# course-scrapper-run.yml does that, by hand.
on:
  push:
    branches:
      - main
    paths:
      - 'tools/course-scrapper/**'
      - '.github/workflows/course-scrapper-deploy.yml'
  workflow_dispatch:

env:
  REGION: us-east5
  PROJECT: gen-lang-client-0316039122
  IMAGE: us-east5-docker.pkg.dev/gen-lang-client-0316039122/ontrack-repo/course-scrapper
  JOB: course-scrapper

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/course-scrapper
    steps:
      - uses: actions/checkout@v4

      - name: Check the script compiles
        run: python -m py_compile course-scrapper.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # COURSE_CATOID and COURSE_NAVOID pick the academic year's calendar. Next year, change
      # both here from a courses-list URL on the calendar site and redeploy.
      #
      # max-retries=0: a retry would re-hit the site after a refusal, which is how a blocked
      # scraper becomes a banned one. Rerun by hand instead.
      - name: Deploy Cloud Run Job
        run: |
          gcloud run jobs deploy "$JOB" \
            --image="$IMAGE:${{ github.sha }}" \
            --region="$REGION" \
            --project="$PROJECT" \
            --task-timeout=7200s \
            --max-retries=0 \
            --memory=512Mi \
            --cpu=1 \
            --set-secrets=DB_URL=DB_URL:latest,DB_USERNAME=DB_USERNAME:latest,DB_PASSWORD=DB_PASSWORD:latest \
            --set-env-vars=^@^COURSE_CATOID=65@COURSE_NAVOID=14802
