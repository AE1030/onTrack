# Dev profile — local Postgres.
# Activate with: -Dspring-boot.run.profiles=dev
# Everything else (JWT secret, grade.encryption.key, MongoDB, etc.) is inherited
# from application.properties / your environment.

# ↓↓↓ EDIT THESE THREE LINES to match your local Postgres ↓↓↓
# WSL dev note: use the Windows host IP, not localhost, when Postgres is running on Windows.
spring.datasource.url=jdbc:postgresql://172.25.48.1:5432/tracker_db
spring.datasource.username=postgres
spring.datasource.password=postgres
# ↑↑↑ EDIT THESE THREE LINES ↑↑↑

spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create tables (incl. d2l_session) in the local DB
spring.jpa.hibernate.ddl-auto=update

# Easier local debugging
spring.jpa.show-sql=true
logging.level.org.tracker.gpatracker=DEBUG
