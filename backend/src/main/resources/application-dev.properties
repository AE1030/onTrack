# =====================================================================
# Local dev profile. Active by default (spring.profiles.default=dev in application.properties).
#
# This file holds dev BEHAVIOUR only. It holds no values and no secrets.
# Every ${VAR} in application.properties / application.yml now resolves from backend/.env,
# which is gitignored. Copy .env.example to .env to set one up.
#
# Property source precedence, verified against spring-dotenv 4.0.0
# (DotenvPropertySource.addToEnvironment calls addAfter("systemEnvironment", ...)):
#
#     system properties > OS env vars > .env > application-dev.properties > application.properties
#
# Two consequences worth remembering:
#   1. A stray exported shell variable still outranks .env and wins silently. That is how dev
#      spent months using production keys for Resend, Gemini and grade encryption.
#   2. .env is read from the process working directory. Run from backend/, or it is not found.
#
# There is no schema override here. Flyway enabled + ddl-auto=validate is now the default in
# application.properties for every profile, dev included, since there is no legacy production
# schema left to treat differently. This file exists as the place a future dev-only override
# would go, not because one is needed today.
# =====================================================================
