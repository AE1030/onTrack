# =====================================================================
# Local dev profile. Active by default (spring.profiles.default=dev in application.properties).
# Replaces the need for a .env file: the values the env-driven properties in
# application.properties / application.yml resolve to are hardcoded here for local runs.
#
# These overrides ONLY apply to the dev profile. In prod (SPRING_PROFILES_ACTIVE=prod)
# this file is not loaded, so the ${ENV_VAR} placeholders fall back to real environment vars.
#
# NOTE: values marked "REPLACE" are placeholders to satisfy startup; the feature behind
# them won't work until you drop in a real key.
# =====================================================================

# ----- PostgreSQL (local) -----
spring.datasource.url=jdbc:postgresql://172.25.48.1:5432/tracker_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# ----- Schema (Flyway) -----
# Flyway owns the schema here; Hibernate only checks that it got what it expects. If validate
# fails, the fix is a new migration -- never a switch back to ddl-auto=update, which is what let
# dev and production drift apart in the first place.
#
# This database was reset to the baseline (main's schema) so it starts where production starts,
# which makes a local run a real rehearsal of the cutover rather than an approximation.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# ----- MongoDB (local) -----
MONGODB_URI=mongodb://172.25.48.1:27017/tracker_db

# ----- JWT (hardcoded for dev; prod uses the JWT_SECRET_KEY env var) -----
JWT_SECRET_KEY=5E71alrkdIhbJjhvqZdXTj0Sf/fJ+RrfkYvSjfNFERQ=

# ----- Grade encryption (32-byte AES key, base64) -----
GRADE_ENCRYPTION_KEY=bHvNWJOL9z6NfBQ1hrGFyXntSg2xyDe31h2/vO980JM=

# ----- App / web -----
SITE_BASE_URL=http://localhost:8080
CORS_ALLOWED_ORIGIN=http://localhost:3000
