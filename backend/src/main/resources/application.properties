spring.application.name=GPATracker

#connect spring boot backend to postgresql database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA (Hibernate) properties
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

#Whenever changing the database schema (making a change to tables) change to create to recreate a new table; this will wipe my existing data but will update the table. Then change back to update.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Server email configuration
site.base.url.https=${SITE_BASE_URL}

#Email Verification token expiry
security.tokens.expiry-seconds=900

# *********** Mailing Properties *************
resend.api-key=${RESEND_API_KEY}

#MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

#Grade Encryption key
grade.encryption.key=${GRADE_ENCRYPTION_KEY}

#Gemini
gemini.api.key=${GEMINI_API_KEY}

#Current term
app.current-term=${APP_CURRENT_TERM}

# Error handling - suppress stack traces and internal details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Suppress noisy framework logs
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.mongodb.driver=WARN

# Your app logs ? keep at INFO
logging.level.org.tracker.gpatracker=INFO

