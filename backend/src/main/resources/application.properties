spring.application.name=GPATracker

# Default to the local dev profile when no profile is explicitly activated.
# Cloud deploy note: set SPRING_PROFILES_ACTIVE=prod (or any non-dev profile)
# so the app uses the env-driven datasource below instead of application-dev.properties.
spring.profiles.default=dev

#connect spring boot backend to postgresql database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA (Hibernate) properties
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Schema changes are Flyway migrations now -- add a file under db/migration, do not change this
# setting. It stays at "update" only because production has not been cut over yet (Flyway is
# disabled below); dev and test already run "validate". See docs/db/PROD_CUTOVER.md.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ****** Flyway ******
# Disabled by default, which is what production resolves to: it is still on ddl-auto=update and
# must not be migrated until the cutover runbook is worked through against a reachable database.
# The dev and test profiles switch this on. Deploys to main are automatic
# (.github/workflows/backend-deploy.yml), so this default is what keeps them a no-op.
spring.flyway.enabled=false
# The production schema predates Flyway. On a non-empty database Flyway stamps history at
# baseline-version and skips it, so V1 (which only reproduces that pre-existing schema) never runs
# there -- migration starts at V2. On an empty database, V1 builds the schema from nothing.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# Server email configuration
site.base.url.https=${SITE_BASE_URL}

#Email Verification token expiry
security.tokens.expiry-seconds=900

# *********** Mailing Properties *************
resend.api-key=${RESEND_API_KEY}

#MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

#Grade Encryption key
grade.encryption.key=${GRADE_ENCRYPTION_KEY}

#Gemini
gemini.api.key=${GEMINI_API_KEY}

#Current term
app.current-term=${APP_CURRENT_TERM}

# Error handling - suppress stack traces and internal details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Suppress noisy framework logs
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.mongodb.driver=WARN

# Your app logs ? keep at INFO
logging.level.org.tracker.gpatracker=INFO


# Index annotations are inert without this: Spring Data Mongo 3.0+ defaults it to false,
# so @CompoundIndex would be silently ignored and every owner lookup would stay a collection scan.
spring.data.mongodb.auto-index-creation=true
