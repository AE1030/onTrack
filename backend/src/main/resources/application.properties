spring.application.name=GPATracker

# Default to the local dev profile when no profile is explicitly activated.
#
# Both profiles resolve the ${VAR} placeholders below from the environment. The difference is
# only where the environment comes from: dev reads backend/.env (gitignored, see .env.example),
# prod reads real env vars set on the cloud host. application-dev.properties carries dev
# behaviour and no values; today it has no overrides of its own, see that file.
#
# Cloud deploy note: set SPRING_PROFILES_ACTIVE=prod so application-dev.properties is not loaded
# and the prod-safe defaults in this file apply.
spring.profiles.default=dev

#connect spring boot backend to postgresql database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#JPA (Hibernate) properties
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Schema changes are Flyway migrations now -- add a file under db/migration, do not change this
# setting. Adding a table no longer happens by adding an @Entity: with "validate" in force, a new
# entity without a matching migration fails startup. Write the migration in the same commit.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ****** Flyway ******
spring.flyway.enabled=true
# Lets Flyway stamp a non-empty, un-versioned database at baseline-version and skip straight past
# it, instead of failing to boot. Only matters for a database that already has V1's tables but no
# flyway_schema_history yet; a fresh empty database just runs V1 like any other migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1


# Server email configuration
site.base.url.https=${SITE_BASE_URL}

# ----- Env vars mapped onto dotted keys -----
# Beans read the dotted key, never the bare env name. The env name is resolvable from .env, which
# outranks application-{profile}.properties, so a bean reading ${JWT_SECRET_KEY} directly could not
# be overridden by a profile at all. Mapping it here once means the test profile can set
# jwt.secret-key and actually win.
jwt.secret-key=${JWT_SECRET_KEY}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}

#Email Verification token expiry
security.tokens.expiry-seconds=900

# *********** Mailing Properties *************
resend.api-key=${RESEND_API_KEY}


#Grade Encryption key
grade.encryption.key=${GRADE_ENCRYPTION_KEY}

#Gemini
gemini.api.key=${GEMINI_API_KEY}

#Current term
# Season and year are the source of truth: the transcript parser compares them separately
# against each "--- <year> <season> ---" header, so it no longer depends on the header being
# rendered exactly one way. app.current-term stays composed from the two because it is the
# display/storage value -- it keys assessment-table rows, so its format must not
# drift ("Winter" + "2026" -> "Winter 2026", unchanged).
app.current-term.season=${APP_CURRENT_TERM_SEASON}
app.current-term.year=${APP_CURRENT_TERM_YEAR}
app.current-term=${APP_CURRENT_TERM_SEASON} ${APP_CURRENT_TERM_YEAR}

# Error handling - suppress stack traces and internal details
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Suppress noisy framework logs
logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Your app logs ? keep at INFO
logging.level.org.tracker.gpatracker=INFO

# Pinned on its own so raising the package level above does not silently switch off the cold start
# line. The cold_start_ms log-based metric and StartupTimeLoggerTest both depend on it.
logging.level.org.tracker.gpatracker.configuration.StartupTimeLogger=INFO



# ----- Leaderboard recompute -----
# When the in-process job rescores the board (and behaviour flags). Six fields: sec min hour day
# month weekday. Set LEADERBOARD_RECOMPUTE_CRON to "-" to switch the in-process job off and rely on
# Cloud Scheduler calling POST /internal/jobs/leaderboard-recompute instead.
leaderboard.recompute.cron=${LEADERBOARD_RECOMPUTE_CRON:0 0 6,14,22 * * *}
leaderboard.recompute.zone=America/Toronto
# Shared secret the X-Jobs-Token header must match. Unset means every trigger call is refused.
jobs.trigger.token=${JOBS_TRIGGER_TOKEN:}

# ----- Session lifetime -----
# Access JWT: short-lived, renewed silently through POST /refresh.
jwt.expiry.ms=3600000
# Refresh token: absolute session length. Rotation does not extend it, so users sign in again
# once this runs out.
jwt.refresh.expiry.days=90
# How long a just-rotated refresh token can be presented again (e.g. two tabs racing) before it is
# treated as stolen and every session for that user is revoked.
jwt.refresh.reuse-grace.seconds=60
