# =====================================================================
# Production profile. Activated by SPRING_PROFILES_ACTIVE=prod on the host.
#
# Read this first, because the mechanism is not obvious.
#
# A Spring profile is just a string. There is no registry and nothing validates it. An active
# profile does exactly two things: it loads application-{profile}.properties if such a file
# exists, and it activates @Profile("{profile}") beans. That is all.
#
# So before this file existed, SPRING_PROFILES_ACTIVE=prod had exactly one observable effect:
# it stopped application-dev.properties from loading, because spring.profiles.default=dev only
# applies when nothing is active. Prod config was defined by subtraction, and any string at all
# would have deployed the same build. This file exists so that "prod" names something real.
#
# Values still come from real environment variables set on the host. There is no .env in prod.
#
# The settings below are DELIBERATELY IDENTICAL to the defaults in application.properties. The
# duplication is the point:
#   - if this profile activates, these lines state the prod contract explicitly;
#   - if it fails to activate, application.properties still holds the same values.
# Either way production gets the same schema behaviour.
# =====================================================================

# ----- Schema -----
# The production database was reset before Flyway ever ran against it, so it starts from V1 like
# any other environment. There is no legacy schema left to protect with a slower rollout.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# ----- Diagnostics -----
# Confirms in the deploy logs which profile actually won, so a failed activation is visible
# rather than inferred from behaviour.
logging.level.org.springframework.core.env=INFO
