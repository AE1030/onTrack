<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password - onTrack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F1F3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 2px 12px rgba(59,10,29,0.08); }
        .logo { text-align: center; margin-bottom: 16px; font-size: 36px; font-weight: 700; }
        .logo .on { color: #F2B94A; }
        .logo .track { color: #3B0A1D; }
        .logo .dot { display: inline-block; width: 10px; height: 10px; background: #7A003C; border-radius: 50%; margin-left: 2px; vertical-align: super; }
        .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
        input { width: 100%; border: 1px solid #E0D7DE; border-radius: 12px; padding: 12px 14px; font-size: 16px; color: #3B0A1D; margin-bottom: 16px; outline: none; }
        input:focus { border-color: #7A003C; border-width: 1.5px; }
        .pw-field { position: relative; }
        .pw-field input { padding-right: 44px; }
        .eye-btn { position: absolute; right: 12px; top: 12px; background: none; border: none; cursor: pointer; padding: 0; line-height: 0; }
        .btn { width: 100%; background: #7A003C; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .error { color: #D32F2F; font-size: 13px; text-align: center; margin-bottom: 8px; }
        .success { color: #2E7D32; font-size: 14px; text-align: center; margin-bottom: 16px; }
        .field-error { color: #D32F2F; font-size: 12px; margin-top: -12px; margin-bottom: 16px; padding-left: 4px; }
        .pw-rules { margin-top: -12px; margin-bottom: 16px; padding-left: 4px; }
        .pw-rule { font-size: 12px; color: #888; margin-bottom: 2px; transition: color 0.2s; }
        .pw-rule.met { color: #2E7D32; }
        .pw-rule.unmet { color: #D32F2F; }
        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 20px 16px; border-radius: 12px; }
            .logo { font-size: 28px; margin-bottom: 12px; }
            .subtitle { font-size: 13px; margin-bottom: 16px; }
            input { font-size: 15px; padding: 10px 12px; margin-bottom: 12px; }
            .btn { padding: 12px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><span class="on">on</span><span class="track">Track</span><span class="dot"></span></div>
        <p class="subtitle">Enter your new password</p>
        <div id="form-view">
            <div class="pw-field">
                <input type="password" id="newPassword" placeholder="New password" oninput="validatePassword()"/>
                <button type="button" class="eye-btn" onclick="togglePassword('newPassword', this)" aria-label="Show password">
                    <svg id="eye-new" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div id="pw-rules" class="pw-rules" style="display:none">
                <div id="rule-length" class="pw-rule">At least 8 characters</div>
                <div id="rule-upper" class="pw-rule">One uppercase letter</div>
                <div id="rule-lower" class="pw-rule">One lowercase letter</div>
                <div id="rule-number" class="pw-rule">One number</div>
            </div>
            <div class="pw-field">
                <input type="password" id="confirmPassword" placeholder="Confirm password"/>
                <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)" aria-label="Show password">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div id="error" class="error" style="display:none"></div>
            <button class="btn" id="submit-btn" onclick="handleSubmit()">Reset password</button>
        </div>
        <div id="success-view" style="display:none">
            <p class="success">Your password has been updated.</p>
            <p class="subtitle">You can now log in with your new password.</p>
        </div>
        <input type="hidden" id="resetToken" th:value="${token}" />
    </div>
    <script>
        const TOKEN = document.getElementById('resetToken').value;
        const PW_REGEX = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;
        const EYE_OPEN = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        const EYE_OFF = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const svg = btn.querySelector('svg');
            if (input.type === 'password') {
                input.type = 'text';
                svg.innerHTML = EYE_OFF;
                btn.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                svg.innerHTML = EYE_OPEN;
                btn.setAttribute('aria-label', 'Show password');
            }
        }

        function validatePassword() {
            const pw = document.getElementById('newPassword').value;
            const rulesEl = document.getElementById('pw-rules');
            if (pw.length === 0) { rulesEl.style.display = 'none'; return; }
            rulesEl.style.display = 'block';
            setRule('rule-length', pw.length >= 8);
            setRule('rule-upper', /[A-Z]/.test(pw));
            setRule('rule-lower', /[a-z]/.test(pw));
            setRule('rule-number', /\d/.test(pw));
        }

        function setRule(id, met) {
            const el = document.getElementById(id);
            el.className = 'pw-rule ' + (met ? 'met' : 'unmet');
        }

        async function handleSubmit() {
            const pw = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errEl = document.getElementById('error');
            const btn = document.getElementById('submit-btn');
            errEl.style.display = 'none';
            if (!pw || !confirm) { errEl.textContent = 'Both fields are required'; errEl.style.display = 'block'; return; }
            if (!PW_REGEX.test(pw)) { errEl.textContent = 'Please meet all password requirements'; errEl.style.display = 'block'; return; }
            if (pw !== confirm) { errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return; }
            btn.disabled = true; btn.textContent = 'Resetting...';
            try {
                const res = await fetch('/reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN, newPassword: pw }) });
                if (!res.ok) { const text = await res.text(); throw new Error(text || 'Reset failed'); }
                document.getElementById('form-view').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
            } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Reset password'; }
        }
    </script>
</body>
</html>
