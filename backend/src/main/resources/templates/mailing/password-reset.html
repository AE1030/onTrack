<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
</head>
<body>
<p th:text="'Hello ' + ${username} + ','">Hello,</p>
<p>We received a request to reset your onTrack password. Click the link below to set a new password.</p>
<p>
    <a th:href="${resetURL}">Reset Password</a>
</p>
<p>If the link above does not work, copy and paste this into your browser:</p>
<p th:text="${resetURL}">reset link</p>
<p>If you did not request this, you can safely ignore this email.</p>
</body>
</html>
