<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Connected - onTrack</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #F5F1F3; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .card { background: #fff; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; box-shadow: 0 2px 12px rgba(59,10,29,0.08); text-align: center; }
        .logo { margin-bottom: 16px; font-size: 36px; font-weight: 700; }
        .logo .on { color: #F2B94A; }
        .logo .track { color: #3B0A1D; }
        .logo .dot { display: inline-block; width: 10px; height: 10px; background: #7A003C; border-radius: 50%; margin-left: 2px; vertical-align: super; }
        .checkmark { font-size: 48px; margin-bottom: 12px; }
        .title { font-size: 20px; font-weight: 700; color: #3B0A1D; margin-bottom: 8px; }
        .subtitle { font-size: 14px; color: #888; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><span class="on">on</span><span class="track">Track</span><span class="dot"></span></div>
        <div class="checkmark">&#10003;</div>
        <p class="title">Google Calendar Connected</p>
        <p class="subtitle">You can close this window and return to the app.</p>
    </div>
</body>
</html>
