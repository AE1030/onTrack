# JPA - use H2 in-memory for relational data (not needed for these tests but required for context loading)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# MongoDB - connect to real local instance for integration tests
spring.data.mongodb.uri=mongodb://localhost/OnTrack

# Dummy Grade encryption key (needed for context loading)
grade.encryption.key=dGVzdER1bW15R3JhZGVFbmNyeXB0aW9uS2V5MTIzNA==

# Gemini - dummy value to satisfy config loading
gemini.api.key=test-key

# App config
app.current-term=Winter 2026

# Disable mail to avoid connection errors during tests
spring.mail.host=localhost
spring.mail.port=25

# Security Test config
site.base.url.https=http://localhost:8080
security.tokens.expiry-seconds=900

# Logging
logging.level.org.tracker.gpatracker=DEBUG
