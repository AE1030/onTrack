# =====================================================================
# Test profile. Activated by @ActiveProfiles("test").
#
# This file is the OPPOSITE of the dev setup, on purpose:
#
#   dev   values come from backend/.env    gitignored, real, machine-specific
#   test  values come from THIS FILE       committed, fake, identical everywhere
#
# A test whose result depends on an ungitignored file on one laptop is not a test. So nothing
# here reads the environment, and there is no .env for tests.
#
# Every key below is DOTTED (resend.api-key, not RESEND_API_KEY). That is load-bearing, not a
# style choice. spring-dotenv inserts .env directly after systemEnvironment:
#
#     system properties > OS env vars > .env > application-{profile}.properties > application.properties
#
# so .env outranks this file. Setting RESEND_API_KEY here would lose to a developer's .env.
# Setting resend.api-key here does not, because .env defines only the uppercase name, and
# application.properties is the single place that maps one onto the other. Never add an
# UPPERCASE key to this file.
# =====================================================================

# The Postgres JDBC URL and credentials are supplied at runtime by @ServiceConnection in
# ContainerIntegrationBase, so none of them is hardcoded here. Tests run against a real Postgres 16
# container, the same engine as production, no H2 substitute.
#
# The schema is built by Flyway, not by Hibernate. The container starts empty, so V1 runs on every
# test run, and ddl-auto=validate then asserts the result matches the entity mappings. That
# combination is what makes a broken migration a failed build rather than a production incident:
# create-drop would have generated the schema from the same mappings it was checked against, and so
# could never have caught a wrong migration.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# ----- Dummy secrets. Fake values, safe to commit. -----
# AES-GCM, so this must decode to exactly 16, 24 or 32 bytes. The previous value decoded to 31
# ("testDummyGradeEncryptionKey1234") and could never have worked; every run silently used the
# developer's exported production key instead, which is why nobody noticed. Decodes to
# "testDummyGradeEncryptionKey12345", 32 bytes.
grade.encryption.key=dGVzdER1bW15R3JhZGVFbmNyeXB0aW9uS2V5MTIzNDU=
jwt.secret-key=dGVzdER1bW15Snd0U2VjcmV0S2V5Rm9yVW5pdFRlc3RzMTIzNA==
calendar.link-token.secret=dGVzdER1bW15Q2FsZW5kYXJMaW5rVG9rZW5TZWNyZXQxMjM0

# ----- Third party. Fake credentials so no test can reach a real service. -----
gemini.api.key=test-key
# ResendConfig is @ConditionalOnProperty(name = "resend.api-key"). Leaving this unset did not
# disable mail, it made the bean's existence depend on the developer's environment: with a .env
# present the suite built a live Resend client on the production key. A fake value here keeps the
# bean present and identical in CI and locally.
resend.api-key=test-resend-key
google.oauth.client-id=test-client-id
google.oauth.client-secret=test-client-secret
google.oauth.redirect-uri=http://localhost:8080/api/calendar/google/callback

# ----- App config -----
app.current-term.season=Winter
app.current-term.year=2026
app.current-term=Winter 2026

# ----- Security / web -----
site.base.url.https=http://localhost:8080
security.tokens.expiry-seconds=900
cors.allowed-origin=http://localhost:3000

# ----- Disable mail transport -----
spring.mail.host=localhost
spring.mail.port=25


# Scheduled job triggers: a known secret for JobTriggerControllerTest, and the in-process cron off
# so it cannot fire in the middle of a test run.
jobs.trigger.token=test-jobs-token
leaderboard.recompute.cron=-
