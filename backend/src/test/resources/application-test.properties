# Postgres JDBC URL/credentials and the Mongo URI are both supplied at runtime by
# @ServiceConnection in ContainerIntegrationBase, so neither is hardcoded here. Tests run against
# real Postgres 16 and Mongo 7 containers — the same engines as production, no H2 substitute.
#
# The schema is built by Flyway, not by Hibernate. The container starts empty, so the full
# migration chain runs V1..V5 on every test run, and ddl-auto=validate then asserts the result
# matches the entity mappings. That combination is what makes a broken migration a failed build
# rather than a production incident: create-drop would have generated the schema from the same
# mappings it was checked against, and so could never have caught a wrong migration.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Dummy grade encryption key not used in production
grade.encryption.key=dGVzdER1bW15R3JhZGVFbmNyeXB0aW9uS2V5MTIzNA==

# Gemini
gemini.api.key=test-key

# App config
app.current-term=Winter 2026

# Disable mail
spring.mail.host=localhost
spring.mail.port=25

# Security
site.base.url.https=http://localhost:8080
security.tokens.expiry-seconds=900

# Dummy test config not used in production
JWT_SECRET_KEY=dGVzdER1bW15Snd0U2VjcmV0S2V5Rm9yVW5pdFRlc3RzMTIzNA==
CORS_ALLOWED_ORIGIN=http://localhost:3000

# D2L/Avenue placeholders. These beans are constructed at startup even though no test
# exercises them, and their @Value has no default -- without these, every @SpringBootTest
# fails to load the context. Port 0 is unroutable, so an accidental call fails fast
# instead of reaching a real host.
d2l.token-service.url=http://localhost:0/
d2l.api.base-url=http://localhost:0/
# Testcontainers supplies a real Mongo for @SpringBootTest tests, so index creation is safe.
spring.data.mongodb.auto-index-creation=true
